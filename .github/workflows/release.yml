# Push a tag named after the manifest's package_version (e.g. v1.2.0) to publish a release.
# It attaches the pack zip and manifest.json; CAVacars 2 reads
# releases/latest/download/manifest.json to offer updates and installs the zip.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag matches manifest
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['package_version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest package_version $version"
            exit 1
          fi
      - name: Build
        run: python3 build.py --zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/fsltl-canada-air-virtual-pack.zip manifest.json \
            --title "$GITHUB_REF_NAME" --generate-notes --latest
